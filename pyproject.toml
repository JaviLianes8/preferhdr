[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preferhdr"
version = "1.0.0"
description = "Parse and build HTTP Prefer and Preference-Applied headers per RFC 7240, typed and zero-dependency"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["prefer", "preference-applied", "rfc7240", "http", "header", "parser", "vary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.scripts]
preferhdr = "preferhdr._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/preferhdr"
Issues = "https://github.com/JaviLianes8/preferhdr/issues"
Changelog = "https://github.com/JaviLianes8/preferhdr/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/preferhdr"]

[tool.hatch.build.targets.sdist]
# Third-party files are fetched locally and never shipped; only their manifest is.
exclude = [
    "IMPROVEMENTS-round*.md",
    "CERT-1.0-*.md",
    ".gitignore",
    "tests/upstream/*",
    "!tests/upstream/MANIFEST.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
timeout = 300
